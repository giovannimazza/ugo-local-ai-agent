ShortDescription: Local, offline voice assistant for Windows (Whisper + Qwen + Piper TTS).
Description: >-
  Ugo is a 100% local and offline voice assistant: you talk into the microphone,
  it understands (faster-whisper), executes real commands on your PC (files,
  apps, websites, volume) and answers by voice (Piper TTS). The LLM layer
  (Qwen2.5 via Ollama) corrects misheard words and translates commands into
  actions. No API keys, no cloud, no per-token cost. The package installs the
  ugo launcher: on first run it provisions Python, the ugo-agent package and
  the local models automatically. It runs entirely on-device: no telemetry,
  no account, no network calls beyond downloading the open-source models.
