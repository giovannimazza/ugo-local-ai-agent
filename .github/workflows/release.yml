name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # il pacchetto e' Python puro, ma la release include anche l'installer
      # winget: ugo.exe (bootstrap, compilato con il csc del .NET Framework)
      # + zip deterministico + manifest allineati (versione, URL, SHA256)
      - name: Verifica coerenza versione/pyproject
        run: |
          python - <<'EOF'
          import re, sys
          tag = "${{ github.ref_name }}".lstrip("v")
          m = re.search(r'^version\s*=\s*"([^"]+)"', open("pyproject.toml", encoding="utf-8").read(), re.M)
          assert m, "versione non trovata nel pyproject"
          assert m.group(1) == tag, f"pyproject dice {m.group(1)} ma il tag e' {tag}: allineare prima di rilasciare"
          print(f"release {tag}: versione allineata")
          EOF

      - name: Build installer winget (ugo.exe + zip + manifest)
        run: python packaging/make_winget_zip.py --tag ${{ github.ref_name }}

      # i manifest del repo restano allineati all'ultima release (il workflow
      # gira con il token default: puo' pushare su main)
      - name: Allinea i manifest winget nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/winget
          git diff --cached --quiet || git commit -m "winget: manifest allineati alla release ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main

      - name: Crea la GitHub Release con note automatiche e installer winget
        uses: softprops/action-gh-release@v2
        with:
          name: Ugo ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ugo-*-winget.zip
            dist/ugo-*-winget-manifests.zip
          body: |
            Installazione / aggiornamento a questa versione:
            ```
            ugo channel stable
            ugo update
            ```
            (o da zero: `pip install git+https://github.com/giovannimazza/ugo-local-ai-agent.git@${{ github.ref_name }}`)

            ### Windows — winget
            Con i manifest pubblicati nel repo [winget-pkgs](https://github.com/microsoft/winget-pkgs):
            ```
            winget install Ugo.Agent
            ```
            Con il bundle allegato (source custom, niente attesa review):
            ```
            winget source add --name ugo --arg "https://raw.githubusercontent.com/giovannimazza/ugo-local-ai-agent/main/packaging/winget-source/" --type "Microsoft.PreIndexed.Package"
            winget install -e Ugo.Agent --source ugo
            ```
