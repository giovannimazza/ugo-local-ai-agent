[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ugo-agent"
version = "0.3.0"
description = "Assistente vocale locale: Whisper (GPU) + Laya + Qwen/Ollama, comandi reali sul PC con widget desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Giovanni Mazza" }]
keywords = ["voice-assistant", "whisper", "laya", "ollama", "offline", "stt", "tts"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",  # richiesto da FastAPI per gli endpoint UploadFile (/api/listen)
    "laya>=0.3.5",
    "pyttsx3>=2.90",
    "vosk>=0.3.42",  # 0.3.45 non ha wheel per macOS arm64/py3.12: l'API usata e' invariata
    "soundcard>=0.4.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "send2trash>=1.8",
    "faster-whisper>=1.0",
    "psutil>=5.9",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
ugo = "ugo_agent.cli:main"
chicco = "ugo_agent.cli:main"   # alias legacy

[tool.setuptools]
packages = ["ugo_agent"]

[tool.setuptools.package-data]
ugo_agent = ["ui.html"]
