[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chicco-agent"
version = "0.2.0"
description = "Assistente vocale locale: Whisper (GPU) + Laya + Qwen/Ollama, comandi reali sul PC con widget desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Giovanni Mazza" }]
keywords = ["voice-assistant", "whisper", "laya", "ollama", "offline", "stt", "tts"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "laya>=0.3.5",
    "pyttsx3>=2.90",
    "vosk>=0.3.45",
    "soundcard>=0.4.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "send2trash>=1.8",
    "faster-whisper>=1.0",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
chicco = "chicco_agent.cli:main"

[tool.setuptools]
packages = ["chicco_agent"]

[tool.setuptools.package-data]
chicco_agent = ["ui.html"]
