<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Ugo — Assistente Locale</title>
<style>
  :root {
    --bg:#0a0c14; --bg-glow:#11142280; --card:#151827; --card2:#1b1f33;
    --acc:#f0a35e; --acc-dim:#f0a35e26; --acc2:#7bd6c4;
    --txt:#eef0f7; --mut:#868dab; --mut-dim:#868dab55;
    --border:#232842; --border-soft:#1c2036;
    --danger:#ef5b5b; --danger-dim:#ef5b5b26;
    --radius-lg:22px; --radius-md:16px; --radius-sm:11px;
    --shadow-card:0 10px 30px -12px #00000090, 0 0 0 1px #ffffff08 inset;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    background:
      radial-gradient(720px 420px at 82% -8%, #f0a35e14, transparent 60%),
      radial-gradient(640px 480px at -6% 14%, #7bd6c412, transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:'Segoe UI Variable Text','Segoe UI',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection { background:var(--acc-dim); color:var(--txt); }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:#2c3252; background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  button, textarea, input { font:inherit; }
  button:focus-visible, .mitem.click:focus-visible, textarea:focus-visible, input:focus-visible {
    outline:2px solid var(--acc2); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
  .app { display:flex; height:100vh; }

  /* ---- chat ---- */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat { flex:1; overflow-y:auto; padding:64px 0 16px; }
  .col { max-width:720px; margin:0 auto; padding:0 24px; display:flex;
         flex-direction:column; gap:22px; }
  .row { display:flex; gap:12px; align-items:flex-start; animation:rise .28s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .row.you { flex-direction:row-reverse; }
  .av { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex;
        align-items:center; justify-content:center; font-size:.95rem; margin-top:2px; }
  .av.y { background:linear-gradient(155deg,#f0a35e,#e08847); box-shadow:0 4px 14px -4px #f0a35e70; }
  .av.b { background:var(--card2); border:1px solid var(--border); box-shadow:0 4px 14px -6px #00000080; }
  .bubble { position:relative; max-width:78%; padding:13px 17px; border-radius:var(--radius-md);
            line-height:1.6; font-size:.945rem; white-space:pre-wrap; word-wrap:break-word; }
  .you .bubble { background:linear-gradient(155deg,#f0a35e,#dd8a4c); color:#1c1206;
                 border-bottom-right-radius:5px; box-shadow:0 8px 22px -10px #f0a35e55; }
  .bot .bubble { background:var(--card); border:1px solid var(--border-soft);
                 border-bottom-left-radius:5px; box-shadow:var(--shadow-card); }
  .meta { display:block; margin-top:9px; font-size:.68rem; color:var(--mut-dim); letter-spacing:.01em; }
  .you .meta { color:#1c120699; }
  .rawstt { margin-top:8px; color:var(--mut); font-size:.74rem; font-style:italic;
            border-top:1px dashed var(--border); padding-top:7px; }

  /* hero iniziale */
  .hero { text-align:center; margin-top:9vh; animation:rise .4s ease both; }
  .wave { display:flex; align-items:center; justify-content:center; gap:5px; height:52px; margin-bottom:6px; }
  .wave span { display:block; width:6px; border-radius:99px; background:linear-gradient(180deg,#f0a35e,#e08847);
               animation:bob 1.6s ease-in-out infinite; }
  .wave span:nth-child(1){ height:16px; animation-delay:-1.2s; }
  .wave span:nth-child(2){ height:32px; animation-delay:-.9s; }
  .wave span:nth-child(3){ height:46px; animation-delay:-.6s; }
  .wave span:nth-child(4){ height:28px; animation-delay:-.3s; }
  .wave span:nth-child(5){ height:14px; animation-delay:0s; }
  @keyframes bob { 0%,100% { transform:scaleY(.45); opacity:.75; } 50% { transform:scaleY(1); opacity:1; } }
  .hero h2 { font-size:1.7rem; font-weight:600; margin:6px 0 10px; letter-spacing:-.01em; }
  .hero p { color:var(--mut); font-size:.95rem; line-height:1.65; max-width:440px; margin:0 auto; }
  .sugg { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:28px; }
  .sugg button { background:var(--card); border:1px solid var(--border); color:var(--txt);
                 padding:10px 15px; border-radius:12px; font-size:.83rem; cursor:pointer;
                 transition:border-color .15s, transform .15s, background .15s; }
  .sugg button:hover { border-color:var(--acc); background:var(--card2); transform:translateY(-1px); }

  /* composer */
  .composer { border-top:1px solid var(--border-soft); padding:16px 20px 20px;
              background:linear-gradient(180deg, transparent, #0a0c14 40%); }
  .composer .inner { max-width:720px; margin:0 auto; display:flex; gap:8px;
                     background:var(--card); border:1px solid var(--border);
                     border-radius:var(--radius-lg); padding:9px 9px 9px 18px; align-items:flex-end;
                     transition:border-color .15s, box-shadow .15s; }
  .composer .inner:focus-within { border-color:#f0a35e70; box-shadow:0 0 0 4px var(--acc-dim); }
  .composer textarea { flex:1; background:transparent; border:none; outline:none;
                       color:var(--txt); font-family:inherit; font-size:.95rem;
                       resize:none; max-height:140px; padding:8px 0; line-height:1.5; }
  .composer textarea::placeholder { color:var(--mut); }
  .iconbtn { width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
             display:flex; align-items:center; justify-content:center; flex-shrink:0;
             transition:transform .12s, filter .12s; }
  .iconbtn:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .iconbtn:active { transform:translateY(0) scale(.95); }
  .mic { background:var(--card2); border:1px solid var(--border); }
  .mic svg { width:17px; height:17px; fill:var(--txt); }
  .mic.rec { background:var(--danger); border-color:var(--danger); animation:pulse 1.2s infinite; }
  .mic.rec svg { fill:#fff; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 #ef5b5b55} 70%{box-shadow:0 0 0 12px #ef5b5b00} 100%{box-shadow:0 0 0 0 #ef5b5b00} }
  .send { background:linear-gradient(155deg,#f0a35e,#dd8a4c); }
  .send svg { width:16px; height:16px; fill:#1c1206; }
  .hint { text-align:center; color:var(--mut-dim); font-size:.7rem; margin-top:10px; }

  /* modale lista app/giochi */
  .overlay { position:fixed; inset:0; background:#05060cc4; backdrop-filter:blur(6px);
             display:none; align-items:center; justify-content:center; z-index:50; }
  .overlay.open { display:flex; animation:fade .15s ease; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
           width:min(560px, 92vw); max-height:78vh; display:flex; flex-direction:column;
           box-shadow:0 24px 70px -18px #000000b0, 0 0 0 1px #ffffff08 inset;
           animation:pop .18s cubic-bezier(.2,.8,.3,1.2); }
  @keyframes pop { from { opacity:0; transform:scale(.97) translateY(6px); } to { opacity:1; transform:none; } }
  .modal header { display:flex; align-items:center; justify-content:space-between;
                  padding:18px 20px 14px; border-bottom:1px solid var(--border-soft); }
  .modal header h3 { font-size:1.02rem; font-weight:600; letter-spacing:-.005em; }
  .modal header span { color:var(--mut); font-size:.76rem; margin-left:10px; }
  .modal header button { background:none; border:none; color:var(--mut); font-size:1.3rem;
                         cursor:pointer; line-height:1; width:30px; height:30px; border-radius:8px;
                         display:flex; align-items:center; justify-content:center; transition:background .15s,color .15s; }
  .modal header button:hover { color:var(--txt); background:var(--card2); }
  .mlist { overflow-y:auto; padding:8px 10px 14px; }
  .mitem { display:flex; align-items:center; gap:12px; padding:10px 10px; border-radius:var(--radius-sm);
           transition:background .12s; }
  .mitem:hover { background:var(--card2); }
  .mitem .ic { width:34px; height:34px; border-radius:10px; background:var(--bg);
               border:1px solid var(--border); display:flex; align-items:center;
               justify-content:center; font-size:.95rem; flex-shrink:0; }
  .mitem .tx { min-width:0; }
  .mitem .tx b { display:block; font-size:.89rem; font-weight:500; white-space:nowrap;
                 overflow:hidden; text-overflow:ellipsis; }
  .mitem .tx small { color:var(--mut); font-size:.72rem; }
  .mcat { display:flex; align-items:baseline; gap:8px; color:var(--acc); font-size:.78rem;
          font-weight:600; letter-spacing:0; text-transform:none;
          padding:16px 10px 7px; border-top:1px solid var(--border-soft); margin-top:6px;
          cursor:pointer; user-select:none; }
  .mcat:first-child { border-top:none; margin-top:0; padding-top:4px; }
  .mcat:hover { filter:brightness(1.2); }
  .mcat .chev { display:inline-block; width:1em; transition:transform .15s; flex-shrink:0; }
  .mcat.closed .chev { transform:rotate(-90deg); }
  .mcat span { color:var(--mut); font-weight:400; text-transform:none; letter-spacing:0; }
  .msearch { width:calc(100% - 20px); margin:0 10px 10px; background:var(--bg);
             border:1px solid var(--border); border-radius:10px; color:var(--txt);
             padding:10px 13px; font-size:.85rem; outline:none; font-family:inherit;
             transition:border-color .15s; }
  .msearch:focus { border-color:#f0a35e70; }
  .msearch::placeholder { color:var(--mut); }
  .topbar { position:fixed; top:16px; right:20px; z-index:40; display:flex;
            gap:7px; align-items:stretch; flex-wrap:wrap; max-width:calc(100vw - 40px);
            justify-content:flex-end; }
  .appsbtn { background:#151827c0; backdrop-filter:blur(10px); border:1px solid var(--border);
             color:var(--txt); font-size:.81rem; font-family:inherit; padding:8px 14px;
             border-radius:999px; cursor:pointer; display:flex;
             align-items:center; gap:7px; white-space:nowrap;
             transition:border-color .15s, transform .15s, background .15s; }
  .appsbtn:hover { border-color:#f0a35e60; transform:translateY(-1px); background:#1b1f33; }
  .appsbtn.small { padding:8px 12px; }
  .mcat { cursor:default; }  /* le voci del menu modello non collassano niente */
  .mitem.click { cursor:pointer; }
  .mitem.click:hover { background:var(--card2); }
  /* loader cambio lingua: spinner + progresso reale del download voce */
  @keyframes langspin { to { transform:rotate(360deg); } }
  .langld { display:flex; flex-direction:column; align-items:center; gap:13px;
            padding:36px 14px 26px; animation:rise .25s ease; text-align:center; }
  .langld .spin { width:34px; height:34px; border-radius:50%; flex-shrink:0;
            border:3px solid var(--acc-dim); border-top-color:var(--acc);
            animation:langspin .8s linear infinite; }
  .langld b { font-size:.9rem; font-weight:500; }
  .langld small { color:var(--mut); font-size:.74rem; max-width:260px; }
  .langld .bar { width:230px; height:6px; border-radius:99px; background:var(--card2);
            overflow:hidden; border:1px solid var(--border-soft); }
  .langld .bar i { display:block; height:100%; width:0%; border-radius:99px;
            background:linear-gradient(90deg,var(--acc),var(--acc2));
            transition:width .4s ease; }
  .langld.fail .spin { border-color:var(--danger-dim); border-top-color:var(--danger); animation:none; }
  .langld .retry { margin-top:2px; padding:7px 20px; border-radius:99px; border:1px solid var(--border);
            background:var(--card2); color:var(--txt); cursor:pointer; font-size:.8rem; }
  .langld .retry:hover { border-color:var(--acc); }
  .mitem .check { margin-left:auto; color:var(--acc2); font-weight:700; }
  .mitem .memdel { margin-left:auto; background:none; border:none; color:var(--mut);
                   font-size:1.1rem; cursor:pointer; padding:4px 8px; border-radius:8px;
                   transition:background .15s,color .15s; }
  .mitem .memdel:hover { color:var(--danger); background:var(--danger-dim); }
</style>
</head>

      <div class="hint" id="status">Ugo può sbagliare. I comandi vengono eseguiti realmente sul tuo PC.</div>
    </div>
  </main>
</div>

<div class="overlay" id="ovl">

function langFailActions(ld, retryLang) {
  // azioni sul fallimento: riprova il cambio, oppure chiudi (download in background)
  const retry = document.createElement('button'); retry.className = 'retry';
  retry.textContent = t('ld_retry');
  retry.onclick = () => switchLang(retryLang, null);

async function switchLang(id, rowEl) {
  const ld = langLoader(t('ld_lang'));
  if (rowEl) rowEl.querySelector('.tx small').textContent = t('m_lang_switching');
  try {
    const rr = await fetch('/api/lang', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({lang: id})});
    const dd = await rr.json();
    if (!dd.ok) {
      ld.classList.add('fail');
      ld.querySelector('small').textContent = (dd.error || t('err_change'));
      langFailActions(ld, id);
      return;
    }
    LANG = dd.lang;
    applyLang();                       // UI gia' tradotta: il loader segue nella lingua nuova
    if (dd.downloading || !dd.voice_ready) {
      // risorsa vocale mancante: attendo con progresso reale dal server
      ld.querySelector('b').textContent = t('ld_voice') +
        (LANG === 'en' ? 'Amy' : 'Paola') + t('ld_voice2');
      const setPct = p => { ld.querySelector('.bar i').style.width = Math.max(4, p) + '%';
                            ld.querySelector('small').textContent =
                              p > 0 && p < 100 ? p + '%' : t('ld_prc'); };
      setPct(dd.pct || 0);
      const ok = await new Promise(resolve => {          // polling finche' pronta
        let noDl = 0;                                    // download mai partito / fallito
        const poll = setInterval(async () => {
          if (!ovl.classList.contains('open')) { clearInterval(poll); resolve(false); return; }
          try {
            const s = await (await fetch('/api/lang')).json();
            if (s.downloading) noDl = 0; else noDl++;
            setPct(s.pct || 0);
            if (s.voice_ready && !s.downloading) { clearInterval(poll); resolve(true); }
            else if (noDl >= 4) {                        // non sta scaricando e non e' pronta: fallito
              clearInterval(poll);
              ld.classList.add('fail');
              ld.querySelector('small').textContent = t('ld_fail');
              langFailActions(ld, id);
              resolve(false);
            }
          } catch {}
        }, 700);
      });
      if (!ok) return;                 // chiuso dall'utente o fallito: il download resta in background
    }
    ld.querySelector('.bar i').style.width = '100%';
    ovl.classList.remove('open');
  } catch (e) {
    ld.classList.add('fail');
    ld.querySelector('small').textContent = t('err_change');
    langFailActions(ld, id);
  }
}

function row(it) {
  const r = document.createElement('div'); r.className = 'mitem';
  const ic = document.createElement('div'); ic.className = 'ic';
  ic.textContent = KIND_ICONS[it.kind] || '📄';

  const s = document.createElement('small'); s.textContent = it.subtitle || '';
  tx.append(b, s); r.append(ic, tx); return r;

const collapsed = new Set();
function renderItems(items, forceOpen) {
  mlist.innerHTML = '';
  const GROUPS = [
    [t('g_games'), k => ['steam','epic','gog','launcher'].includes(k)],
    [t('g_apps2'), k => ['lnk','appx','portable'].includes(k)],
    [t('g_sys'), k => k === 'shell']];
  const rest = [...items];
  for (const [name, test] of GROUPS) {
    const grp = rest.filter(it => test(it.kind));
    for (const it of grp) rest.splice(rest.indexOf(it), 1);
    if (!grp.length) continue;
    const isClosed = !forceOpen && collapsed.has(name);
    const h = document.createElement('div'); h.className = 'mcat' + (isClosed ? ' closed' : '');
    h.title = isClosed ? 'Espandi' : 'Comprimi';
    h.innerHTML = '<span class="chev">▾</span>' + name + ' <span>· ' + grp.length + '</span>';
    const box = document.createElement('div'); box.className = 'mgroup';
    if (isClosed) box.style.display = 'none';
    for (const it of grp) box.appendChild(row(it));
    h.onclick = () => {
      const nowClosed = !h.classList.contains('closed');
      h.classList.toggle('closed', nowClosed);
      h.title = nowClosed ? 'Espandi' : 'Comprimi';
      box.style.display = nowClosed ? 'none' : '';
      nowClosed ? collapsed.add(name) : collapsed.delete(name);
    };
    mlist.append(h, box);
  }
  for (const it of rest) mlist.appendChild(row(it));
}

function showList(title, items) {
  currentItems = items;
  mtitle.textContent = title;
  mcount.textContent = items.length + t('voci');
  msearch.style.display = items.length > 15 ? '' : 'none';
  msearch.value = '';
  renderItems(items);
  ovl.classList.add('open');
}

  const s = document.createElement('small');
  s.textContent = (kind === 'fix' ? 'refuso' : 'alias app')
    + ' \u00b7 usato ' + (entry.count || 1) + 'x';
  tx.append(b, s);

  del.textContent = '\u00d7'; del.title = 'Elimina';
  del.onclick = async (ev) => {
    ev.stopPropagation();
    await fetch('/api/memory', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action: kind === 'fix' ? 'del_fix' : 'del_app', raw: kind === 'fix' ? entry.raw : entry.said})});
    openMem();  // ricarico il pannello
  };
  r.onclick = () => {
    const cur = kind === 'fix' ? entry.fixed : entry.app;
    const nu = prompt('Correggi la destinazione di "' + (kind === 'fix' ? entry.raw : entry.said) + '":', cur);
    if (nu && nu.trim() && nu.trim() !== cur) {
      fetch('/api/memory', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action: kind === 'fix' ? 'set_fix' : 'set_app',
                              raw: kind === 'fix' ? entry.raw : entry.said, fixed: nu.trim()})})
        .then(() => openMem());
    }
  };
  r.append(ic, tx, del); return r;
}

  const ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = '\u26a1';
  const tx = document.createElement('div'); tx.className = 'tx';
  const b = document.createElement('b'); b.textContent = r.name;
  const s = document.createElement('small');
  s.textContent = r.steps.join(' \u2192 ') + ' \u00b7 usata ' + (r.count || 0) + 'x';
  tx.append(b, s);
  const run = document.createElement('button'); run.className = 'memdel';
  run.textContent = '\u25b6'; run.title = 'Esegui ora';
  run.onclick = async (ev) => {
    ev.stopPropagation();
    run.textContent = '\u2026';
    await fetch('/api/routines', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'run', id: r.id})});
    openRoutines();
  };
  const del = document.createElement('button'); del.className = 'memdel';
  del.textContent = '\u00d7'; del.title = 'Elimina';
  del.onclick = async (ev) => {
    ev.stopPropagation();
    await fetch('/api/routines', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'delete', id: r.id})});
    openRoutines();
  };
  el.append(ic, tx, run, del);
  el.onclick = () => editRoutine(r);
  return el;
}

function editRoutine(r) {
  const isNew = !r;
  const name = isNew ? '' : (r.name || '');
  const stepsStr = isNew ? '' : (r.steps || []).join('\n');
  const n = prompt(isNew ? 'Nome/trigger della routine (cosa dirai a voce):'
                         : 'Nome/trigger:', name);
  if (n === null) return openRoutines();
  const nm = n.trim();
  if (!nm) return openRoutines();
  const st = prompt('Comandi, uno per riga (max 8):\nes. apri spotify\nvolume 80\nche tempo fa', stepsStr);
  if (st === null) return openRoutines();
  const steps = st.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 8);
  if (!steps.length) return openRoutines();
  fetch('/api/routines', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action: isNew ? 'create' : 'update', id: isNew ? '' : r.id,
                          name: nm, steps})}).then(openRoutines);
}

async function openRoutines() {
  try {
    const r = await fetch('/api/routines'); const d = await r.json();
    const list = d.routines || [];
    document.getElementById('routcount').textContent = list.length;
    mtitle.textContent = '\u26a1 Routine';
    mcount.textContent = 'una frase attiva una sequenza di comandi \u2014 ' +
      'creale qui o a voce: \u201cUgo, quando dico modo gaming esegui apri steam; apri discord; volume 80\u201d';
    msearch.style.display = 'none';
    mlist.innerHTML = '';
    if (!list.length) {
      const e = document.createElement('div'); e.className = 'mitem';
      e.innerHTML = '<div class="tx"><small>Nessuna routine: creala col \u2795 o a voce.</small></div>';
      mlist.appendChild(e);
    }
    for (const r of list) mlist.appendChild(routRow(r));
    const add = document.createElement('div'); add.className = 'mitem click';
    add.innerHTML = '<div class="ic">\u2795</div><div class="tx"><b>Nuova routine</b>' +
      '<small>es. \u201cmodo gaming\u201d \u2192 apri steam, apri discord, volume 80</small></div>';
    add.onclick = () => editRoutine(null);
    mlist.appendChild(add);
    ovl.classList.add('open');
  } catch {}
}
document.getElementById('routbtn').onclick = openRoutines;

// --- dashboard latenze (📊) --------------------------------------------
const STAGE_LABEL = {
  vosk: {it: 'Vosk (fastlane pre-lettura)', en: 'Vosk (pre-read fastlane)'},
  fastlane: {it: 'Fastlane (match comandi)', en: 'Fastlane (command match)'},
  whisper: {it: 'Whisper (trascrizione)', en: 'Whisper (transcription)'},
  qwen_normalize: {it: 'Qwen (correzione STT)', en: 'Qwen (STT correction)'},
  qwen_intent: {it: 'Qwen (interpretazione intent)', en: 'Qwen (intent parsing)'},
  qwen_suggest: {it: 'Qwen (suggerimento app)', en: 'Qwen (app suggestion)'},
  qwen_translate: {it: 'Qwen (traduzione risposta)', en: 'Qwen (reply translation)'},
  tts_piper: {it: ' - Piper TTS', en: ' - Piper TTS'},
  tts_sapi: {it: 'TTS di sistema', en: 'System TTS'},
  command: {it: '⏱ Comando completo (voce → risposta)',
            en: '⏱ Full command (voice → reply)'}
};
function stageLabel(k) {
  const e = STAGE_LABEL[k];
  if (k === 'tts_piper') {
    // la voce in uso, non l'elenco generico Paola/Amy
    return LANG === 'en' ? 'Piper TTS (voice in use)' : 'Piper TTS (Voce in Uso)';
  }
  return e ? (e[LANG] || e.it) : k;
}

// glifi pausa/play centrati nel riquadro (l'emoji ⏸ e' sempre decentrata
// e con le due stanghette sfalsate a seconda del font)
const pauseSVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">' +
  '<rect x="6.5" y="5" width="4" height="14" rx="1.2"/>' +
  '<rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>';
const playSVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">' +
  '<path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5C8.9 4.2 8 4.7 8 5.5z"/></svg>';
let statsTimer = null;

async function refreshStats() {
  try {
    const d = await (await fetch('/api/stats')).json();
    const cmd = (d.stages || []).find(s => s.stage === 'command');
    const sc = document.getElementById('statscmd');
    sc.textContent = t('b_stats');   // label parlante; i numeri restano nel tooltip
    document.getElementById('statsbtn').title =
      (cmd ? 'Dashboard latenze · ultimo comando ' + cmd.avg.toFixed(1) + 's'
           : d.enabled ? 'Dashboard latenze · nessun comando registrato'
           : 'Dashboard latenze · raccolta sospesa');
    if (!ovl.classList.contains('open')) {
      if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
      return;
    }
    mtitle.textContent = t('m_stats');
    mcount.textContent = t('stats_sub') + d.models.stt +
      ' · AI ' + d.models.llm + ' · TTS ' + (d.models.tts || '').replace('piper-', '');
    msearch.style.display = 'none';
    mlist.innerHTML = '';
    if (!(d.stages || []).length) {
      const e = document.createElement('div'); e.className = 'mitem';
      e.innerHTML = '<div class="tx"><small>Nessun dato ancora: dai un comando a Ugo ' +
        '(voce o testo) e i numeri compaiono qui in tempo reale.</small></div>';
      mlist.appendChild(e);
    }
    const others = d.stages.filter(s => s.stage !== 'command');
    const maxavg = Math.max(0.001, ...others.map(s => s.avg));
    for (const s of d.stages) {
      const el = document.createElement('div'); el.className = 'mitem';
      const pct = s.stage === 'command' ? 100 :
        Math.min(100, Math.round(s.avg / maxavg * 100));
      const tx = document.createElement('div'); tx.className = 'tx';
      const b = document.createElement('b'); b.textContent = stageLabel(s.stage);
      const sm = document.createElement('small');
      const tps = s.tps_avg ? ' · ' + s.tps_avg + ' tok/s' : '';
      sm.textContent = (LANG === 'en' ? 'avg ' : 'media ') + s.avg.toFixed(2) + 's · p95 ' +
        s.p95.toFixed(2) + 's · max ' + s.max.toFixed(2) + 's · ' + s.n +
        (s.n === 1 ? (LANG === 'en' ? ' sample' : ' campione') : (LANG === 'en' ? ' samples' : ' campioni')) + tps;
      const bar = document.createElement('div');
      bar.style.cssText = 'height:6px;background:var(--border);border-radius:3px;margin-top:5px;overflow:hidden';
      const fill = document.createElement('div');
      fill.style.cssText = 'height:100%;width:' + pct + '%;background:var(--acc)';
      bar.appendChild(fill);
      tx.append(b, sm, bar);
      el.appendChild(tx);
      mlist.appendChild(el);
    }
    if (d.process && d.process.rss_mb) {
      const p = document.createElement('div'); p.className = 'mitem';
      p.innerHTML = '<div class="tx"><small>' +
        (LANG === 'en' ? 'server process: ' : 'processo server: ') + d.process.rss_mb +
        ' MB RAM · cpu ' + d.process.cpu_pct + '% · ' + d.process.threads +
        (LANG === 'en' ? ' threads</small></div>' : ' thread</small></div>');
      mlist.appendChild(p);
    }
    // stacco prima del toggle sospendi/riprendi
    if (mlist.lastChild) {
      const sp = document.createElement('div');
      sp.style.cssText = 'height:14px';
      mlist.appendChild(sp);
    }
    const tog = document.createElement('div'); tog.className = 'mitem click';
    tog.innerHTML = '<div class="ic">' + (d.enabled ? pauseSVG : playSVG) + '</div><div class="tx"><b>' +
      (d.enabled ? 'Sospendi la raccolta dati' : 'Riprendi la raccolta dati') +
      '</b><small>il pannello continua a mostrare gli ultimi valori raccolti</small></div>';
    tog.onclick = async () => {
      await fetch('/api/stats', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({enabled: !d.enabled})});
      refreshStats();
    };
    mlist.appendChild(tog);
  } catch {}
}

function openStats() {
  ovl.classList.add('open');
  refreshStats();
  if (!statsTimer) statsTimer = setInterval(refreshStats, 3000);
}
document.getElementById('statsbtn').onclick = openStats;
refreshStats();  // aggiorna il badge della topbar subito, senza aprire il pannello

function scroll() { chat.scrollTop = chat.scrollHeight; }
function setStatus(s) { statusEl.textContent = s || 'Ugo può sbagliare. I comandi vengono eseguiti realmente sul tuo PC.'; }

function add(role, text, meta, raw) {
  hero && hero.remove();
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'you' ? 'you' : 'bot');
  const av = document.createElement('div');
  av.className = 'av ' + (role === 'you' ? 'y' : 'b');
  av.textContent = role === 'you' ? '🧑' : '🎙️';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  if (raw) {
    const r = document.createElement('div'); r.className = 'rawstt';
    r.title = 'Trascrizione originale corretta da Qwen';
    r.textContent = '🎧 "' + raw + '"';
    b.appendChild(r);
  }
  if (meta) { const m = document.createElement('span'); m.className = 'meta'; m.textContent = meta; b.appendChild(m); }
  row.append(av, b); col.appendChild(row); scroll();
}

// ---- invio testo ----
async function sendText() {
  const t = textEl.value.trim(); if (!t) return;
  textEl.value = ''; textEl.style.height = 'auto';
  add('you', t); setStatus('Ugo sta elaborando…');
  try {
    const r = await fetch('/api/text', {method:'POST', headers:{'Content-Type':'application/json'},
                                        body:JSON.stringify({text:t})});
    const e = await r.json();
    add('bot', e.assistant || e.error || 'errore',
        e.intent && e.intent !== '-' ? `${e.intent} · ${e.detector} · ${e.ms} ms` : '');
    playReply();
    if (e.show_list) maybeShowList();
  } catch { add('bot', 'Server non raggiungibile.'); }
  setStatus('');
}
document.getElementById('send').onclick = sendText;
textEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
textEl.addEventListener('input', () => { textEl.style.height = 'auto'; textEl.style.height = Math.min(140, textEl.scrollHeight) + 'px'; });
document.querySelectorAll('.sugg button').forEach(b => b.onclick = () => { textEl.value = b.dataset.q; sendText(); });

// ---- microfono (come prima: webm -> /api/listen) ----
let media, chunks = [], recording = false;
micBtn.onclick = async () => {
  if (recording) { media.stop(); return; }
  try { media = new MediaRecorder(await navigator.mediaDevices.getUserMedia({audio:true})); }
  catch { setStatus('Permesso microfono negato'); return; }
  chunks = []; recording = true; micBtn.classList.add('rec'); setStatus('🔴 Sto ascoltando… clicca di nuovo per inviare');
  media.ondataavailable = e => chunks.push(e.data);
  media.onstop = async () => {
    recording = false; micBtn.classList.remove('rec'); setStatus('Trascrivo…');
    try {
      const fd = new FormData();
      fd.append('audio', new Blob(chunks, {type:'audio/webm'}), 'cmd.webm');
      const r = await fetch('/api/listen', {method:'POST', body:fd});
      const e = await r.json();
      if (e.error) { setStatus(e.error); return; }
      if (e.user) { add('you', e.user, '', e.raw); }
      add('bot', e.assistant, e.intent && e.intent !== '-' ? `${e.intent} · ${e.detector} · ${e.ms} ms` : '');
      if (e.show_list) maybeShowList();
    } catch { add('bot', 'Server non raggiungibile.'); }
    setStatus(''); playReply();
  };
  media.start();
};

async function playReply() { try { new Audio('/_tts_reply.wav?t=' + Date.now()).play(); } catch {} }
