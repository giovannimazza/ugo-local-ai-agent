<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Ugo — Assistente Locale</title>
<style>
  :root { --bg:#0f1220; --card:#181c2f; --acc:#7c6cff; --txt:#e8e9f3; --mut:#8b90ad;
          --border:#262b47; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; }
  .app { display:flex; height:100vh; }

  /* ---- chat ---- */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat { flex:1; overflow-y:auto; padding:28px 0 12px; }
  .col { max-width:760px; margin:0 auto; padding:0 20px; display:flex;
         flex-direction:column; gap:18px; }
  .row { display:flex; gap:14px; align-items:flex-start; }
  .row.you { flex-direction:row-reverse; }
  .av { width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex;
        align-items:center; justify-content:center; font-size:1.05rem; }
  .av.y { background:var(--acc); }
  .av.b { background:var(--card); border:1px solid var(--border); }
  .bubble { max-width:76%; padding:12px 16px; border-radius:16px; line-height:1.55;
            font-size:.95rem; white-space:pre-wrap; word-wrap:break-word; }
  .you .bubble { background:var(--acc); color:#fff; border-top-right-radius:4px; }
  .bot .bubble { background:var(--card); border:1px solid var(--border);
                 border-top-left-radius:4px; }
  .meta { display:block; margin-top:8px; font-size:.68rem; color:var(--mut); }
  .rawstt { margin-top:6px; color:var(--mut); font-size:.72rem; font-style:italic;
            border-top:1px dashed var(--border); padding-top:5px; }

  /* hero iniziale */
  .hero { text-align:center; margin-top:10vh; }
  .hero .logo { font-size:2.6rem; }
  .hero h2 { font-size:1.5rem; margin:12px 0 8px; }
  .hero p { color:var(--mut); font-size:.95rem; }
  .sugg { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:26px; }
  .sugg button { background:var(--card); border:1px solid var(--border); color:var(--txt);
                 padding:10px 14px; border-radius:12px; font-size:.85rem; cursor:pointer; }
  .sugg button:hover { border-color:var(--acc); }

  /* composer */
  .composer { border-top:1px solid var(--border); padding:14px 20px 18px; }
  .composer .inner { max-width:760px; margin:0 auto; display:flex; gap:10px;
                     background:var(--card); border:1px solid var(--border);
                     border-radius:16px; padding:10px; align-items:flex-end; }
  .composer textarea { flex:1; background:transparent; border:none; outline:none;
                       color:var(--txt); font-family:inherit; font-size:.95rem;
                       resize:none; max-height:140px; padding:6px 8px; line-height:1.4; }
  .iconbtn { width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
             display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mic { background:var(--acc); }
  .mic svg { width:18px; height:18px; fill:#fff; }
  .mic.rec { background:#e5484d; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 #e5484d66} 70%{box-shadow:0 0 0 12px #e5484d00} 100%{box-shadow:0 0 0 0 #e5484d00} }
  .send { background:var(--acc); }
  .send svg { width:17px; height:17px; fill:#fff; }
  .hint { text-align:center; color:var(--mut); font-size:.7rem; margin-top:8px; }

  /* modale lista app/giochi */
  .overlay { position:fixed; inset:0; background:#000000aa; backdrop-filter:blur(3px);
             display:none; align-items:center; justify-content:center; z-index:50; }
  .overlay.open { display:flex; }
  .modal { background:var(--bg); border:1px solid var(--border); border-radius:18px;
           width:min(560px, 92vw); max-height:78vh; display:flex; flex-direction:column;
           box-shadow:0 18px 60px #00000088; }
  .modal header { display:flex; align-items:center; justify-content:space-between;
                  padding:16px 20px 12px; border-bottom:1px solid var(--border); }
  .modal header h3 { font-size:1rem; font-weight:600; }
  .modal header span { color:var(--mut); font-size:.75rem; margin-left:10px; }
  .modal header button { background:none; border:none; color:var(--mut); font-size:1.3rem;
                         cursor:pointer; line-height:1; }
  .modal header button:hover { color:var(--txt); }
  .mlist { overflow-y:auto; padding:10px 12px 14px; }
  .mitem { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:12px; }
  .mitem:hover { background:var(--card); }
  .mitem .ic { width:34px; height:34px; border-radius:10px; background:var(--card);
               border:1px solid var(--border); display:flex; align-items:center;
               justify-content:center; font-size:.95rem; flex-shrink:0; }
  .mitem .tx { min-width:0; }
  .mitem .tx b { display:block; font-size:.9rem; font-weight:500; white-space:nowrap;
                 overflow:hidden; text-overflow:ellipsis; }
  .mitem .tx small { color:var(--mut); font-size:.7rem; }
  .mcat { display:flex; align-items:baseline; gap:8px; color:var(--acc); font-size:.72rem;
          font-weight:600; letter-spacing:.06em; text-transform:uppercase;
          padding:14px 12px 6px; border-top:1px solid var(--border); margin-top:8px;
          cursor:pointer; user-select:none; }
  .mcat:first-child { border-top:none; margin-top:0; padding-top:4px; }
  .mcat:hover { filter:brightness(1.25); }
  .mcat .chev { display:inline-block; width:1em; transition:transform .15s; flex-shrink:0; }
  .mcat.closed .chev { transform:rotate(-90deg); }
  .mcat span { color:var(--mut); font-weight:400; text-transform:none; letter-spacing:0; }
  .msearch { width:calc(100% - 24px); margin:0 12px 10px; background:var(--bg);
             border:1px solid var(--border); border-radius:10px; color:var(--txt);
             padding:9px 12px; font-size:.85rem; outline:none; font-family:inherit; }
  .msearch:focus { border-color:var(--acc); }
  .msearch::placeholder { color:var(--mut); }
  .topbar { position:fixed; top:18px; right:22px; z-index:40; display:flex;
            gap:8px; align-items:stretch; }
  .appsbtn { background:var(--card); border:1px solid var(--border); color:var(--txt);
             font-size:.82rem; font-family:inherit; padding:8px 14px;
             border-radius:999px; cursor:pointer; display:flex;
             align-items:center; gap:8px; white-space:nowrap;
             transition:border-color .15s, transform .15s; }
  .appsbtn:hover { border-color:var(--acc); transform:translateY(-1px); }
  .appsbtn.small { padding:8px 12px; }
  .mcat { cursor:default; }  /* le voci del menu modello non collassano niente */
  .mitem.click { cursor:pointer; }
  .mitem.click:hover { background:var(--card); }
  .mitem .check { margin-left:auto; color:var(--acc); font-weight:700; }
  .mitem .memdel { margin-left:auto; background:none; border:none; color:var(--mut);
                   font-size:1.1rem; cursor:pointer; padding:4px 8px; border-radius:8px; }
  .mitem .memdel:hover { color:#e5484d; background:var(--card); }
</style>
</head>
<body>
<div class="topbar">
<button class="appsbtn small" id="modelbtn" title="Modello AI per correzione e interpretazione">⚙️ <span id="modelname">…</span></button>
<button class="appsbtn small" id="sttbtn" title="Modello di trascrizione vocale (Whisper)">🎤 <span id="sttname">…</span></button>
<button class="appsbtn small" id="ttsbtn" title="Voce di risposta (TTS)">🔊 <span id="ttsname">…</span></button>
<button class="appsbtn small" id="membtn" title="Memoria appresa: refusi corretti e alias-app">🧠 <span id="memcount">…</span></button>
<button class="appsbtn" id="appsbtn" title="App e giochi installati sul PC">🗂️ App e giochi</button>
<button class="appsbtn" id="routbtn" title="Routine: una frase attiva una sequenza di comandi">⚡ Routine <span id="routcount"></span></button>
<button class="appsbtn small" id="statsbtn" title="Dashboard latenze: whisper, qwen, tts, comandi">📊 <span id="statscmd">…</span></button>
</div>
<div class="app">
  <main class="main">
    <div class="chat" id="chat">
      <div class="col" id="col">
        <div class="hero" id="hero">
          <div class="logo">🎙️</div>
          <h2>Ciao, sono Ugo</h2>
          <p>Il tuo assistente locale. Parla col microfono o scrivi: creo cartelle e file,<br>
             apro app e siti, faccio ricerche, regolo il volume.</p>
          <div class="sugg">
            <button data-q="crea una cartella chiamata Prova sul desktop">📁 Crea una cartella</button>
            <button data-q="crea un file di testo chiamata spesa con dentro latte e pane">📝 Crea una nota</button>
            <button data-q="apri youtube">▶️ Apri YouTube</button>
            <button data-q="cerca notizie AI su google">🔎 Cerca su Google</button>
            <button data-q="che ore sono?">🕐 Che ore sono?</button>
          </div>
        </div>
      </div>
    </div>
    <div class="composer">
      <div class="inner">
        <textarea id="text" rows="1" placeholder="Scrivi un messaggio a Ugo…"></textarea>
        <button class="iconbtn mic" id="mic" title="Registra un comando vocale">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <button class="iconbtn send" id="send" title="Invia">
          <svg viewBox="0 0 24 24"><path d="M2 21 23 12 2 3l4 8 12 1-12 1z"/></svg>
        </button>
      </div>
      <div class="hint" id="status">Ugo può sbagliare. I comandi vengono eseguiti realmente sul tuo PC.</div>
    </div>
  </main>
</div>

<div class="overlay" id="ovl">
  <div class="modal">
    <header>
      <div><h3 id="mtitle">Elenco</h3><span id="mcount"></span></div>
      <button id="mclose" title="Chiudi">&times;</button>
    </header>
    <input class="msearch" id="msearch" placeholder="Cerca per nome…" style="display:none">
    <div class="mlist" id="mlist"></div>
  </div>
</div>
<script>
const chat = document.getElementById('chat'), col = document.getElementById('col');
const hero = document.getElementById('hero'), statusEl = document.getElementById('status');
const textEl = document.getElementById('text'), micBtn = document.getElementById('mic');
const ovl = document.getElementById('ovl'), mlist = document.getElementById('mlist');
const mtitle = document.getElementById('mtitle'), mcount = document.getElementById('mcount');

const KIND_ICONS = {steam:'🎮', epic:'🟣', gog:'🟡', launcher:'🚀', appx:'🪟',
                    lnk:'🪟', portable:'📦', shell:'⚙️'};
const KIND_LABEL = {steam:'Steam', epic:'Epic Games', gog:'GOG', launcher:'Launcher',
                    appx:'Microsoft Store', lnk:'applicazione', portable:'portabile',
                    shell:'sistema'};
const appsBtn = document.getElementById('appsbtn'), msearch = document.getElementById('msearch');
let currentItems = [];

function row(it) {
  const r = document.createElement('div'); r.className = 'mitem';
  const ic = document.createElement('div'); ic.className = 'ic';
  ic.textContent = KIND_ICONS[it.kind] || '📄';
  const tx = document.createElement('div'); tx.className = 'tx';
  const b = document.createElement('b'); b.textContent = it.title;
  const s = document.createElement('small'); s.textContent = it.subtitle || '';
  tx.append(b, s); r.append(ic, tx); return r;
}

const collapsed = new Set();
function renderItems(items, forceOpen) {
  mlist.innerHTML = '';
  const GROUPS = [
    ['Giochi', k => ['steam','epic','gog','launcher'].includes(k)],
    ['Applicazioni', k => ['lnk','appx','portable'].includes(k)],
    ['Strumenti di sistema', k => k === 'shell']];
  const rest = [...items];
  for (const [name, test] of GROUPS) {
    const grp = rest.filter(it => test(it.kind));
    for (const it of grp) rest.splice(rest.indexOf(it), 1);
    if (!grp.length) continue;
    const isClosed = !forceOpen && collapsed.has(name);
    const h = document.createElement('div'); h.className = 'mcat' + (isClosed ? ' closed' : '');
    h.title = isClosed ? 'Espandi' : 'Comprimi';
    h.innerHTML = '<span class="chev">▾</span>' + name + ' <span>· ' + grp.length + '</span>';
    const box = document.createElement('div'); box.className = 'mgroup';
    if (isClosed) box.style.display = 'none';
    for (const it of grp) box.appendChild(row(it));
    h.onclick = () => {
      const nowClosed = !h.classList.contains('closed');
      h.classList.toggle('closed', nowClosed);
      h.title = nowClosed ? 'Espandi' : 'Comprimi';
      box.style.display = nowClosed ? 'none' : '';
      nowClosed ? collapsed.add(name) : collapsed.delete(name);
    };
    mlist.append(h, box);
  }
  for (const it of rest) mlist.appendChild(row(it));
}

function showList(title, items) {
  currentItems = items;
  mtitle.textContent = title;
  mcount.textContent = items.length + ' voci';
  msearch.style.display = items.length > 15 ? '' : 'none';
  msearch.value = '';
  renderItems(items);
  ovl.classList.add('open');
}

document.getElementById('mclose').onclick = () => ovl.classList.remove('open');
ovl.onclick = e => { if (e.target === ovl) ovl.classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') ovl.classList.remove('open'); });

msearch.addEventListener('input', () => {
  const q = msearch.value.toLowerCase();
  const filtered = currentItems.filter(it =>
    (it.title + ' ' + (it.subtitle || '')).toLowerCase().includes(q));
  renderItems(filtered, q.length > 0);
});

async function openModelMenu() {
  try {
    const r = await fetch('/api/model'); const d = await r.json();
    document.getElementById('modelname').textContent = d.active.replace('qwen2.5:', 'Qwen ');
    mtitle.textContent = 'Modello AI';
    mcount.textContent = 'correzione, interpretazione e suggerimenti';
    msearch.style.display = 'none';
    mlist.innerHTML = '';
    for (const name of d.available) {
      const it = {title: name.replace('qwen2.5:', 'Qwen '), subtitle: '', kind: 'appx',
                  _model: name, _active: name === d.active};
      const rowEl = row(it);
      rowEl.classList.add('click');
      if (it._active) {
        const c = document.createElement('span'); c.className = 'check'; c.textContent = '✓';
        rowEl.appendChild(c);
      }
      rowEl.onclick = async () => {
        const rr = await fetch('/api/model', {method:'POST',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify({model: it._model})});
        const dd = await rr.json();
        if (dd.ok) { document.getElementById('modelname').textContent =
                       it._model.replace('qwen2.5:', 'Qwen '); ovl.classList.remove('open'); }
        else add('bot', 'Errore: ' + (dd.error || 'cambio modello fallito'));
      };
      mlist.appendChild(rowEl);
    }
    ovl.classList.add('open');
  } catch {}
}
document.getElementById('modelbtn').onclick = openModelMenu;
async function openSttMenu() {
  try {
    const r = await fetch('/api/stt/models'); const d = await r.json();
    mtitle.textContent = 'Trascrittore vocale';
    mcount.textContent = 'whisper: qualita\u0300 vs velocita\u0300 — vosk sempre come ripiego';
    msearch.style.display = 'none';
    mlist.innerHTML = '';
    for (const m of d.models) {
      const short = m.id.replace('large-v3-turbo', 'large-v3-turbo');
      const tag = m.downloading ? '\u23f3 download\u2026' : (m.installed ? '' : '  \u2b07 non installato');
      const it = {title: short + tag, subtitle: m.label, kind: 'appx', _m: m};
      const rowEl = row(it);
      rowEl.classList.add('click');
      if (m.active) {
        const c = document.createElement('span'); c.className = 'check'; c.textContent = '\u2713';
        rowEl.appendChild(c);
      }
      rowEl.onclick = async () => {
        if (m.downloading) return;
        const rr = await fetch('/api/stt/model', {method:'POST',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify({model: m.id})});
        const dd = await rr.json();
        if (!dd.ok) { add('bot', 'Errore: ' + (dd.error || 'cambio fallito')); return; }
        document.getElementById('sttname').textContent = short;
        ovl.classList.remove('open');
        if (dd.status === 'downloading') {
          add('bot', '\u2b07\ufe0f Scarico il modello ' + short +
              ' (in background). Finche\u0300 non e\u0300 pronto si usa Vosk.');
          const poll = setInterval(async () => {
            try {
              const s = await (await fetch('/api/stt/models')).json();
              const me = s.models.find(x => x.id === m.id);
              if (me && me.installed) { clearInterval(poll);
                add('bot', '\u2705 Trascrittore pronto: ' + short); }
            } catch { clearInterval(poll); }
          }, 4000);
        }
      };
      mlist.appendChild(rowEl);
    }
    ovl.classList.add('open');
  } catch {}
}
document.getElementById('sttbtn').onclick = openSttMenu;
(async () => { try { const s = await (await fetch('/api/stt/models')).json();
  const a = s.models.find(m => m.active);
  document.getElementById('sttname').textContent = a ? a.id : s.fallback; } catch {} })();

// --- menu voce di risposta (TTS): Piper naturale (Paola) / voce di sistema ---
async function openTtsMenu() {
  try {
    const d = await (await fetch('/api/tts')).json();
    mtitle.textContent = 'Voce di risposta';
    mcount.textContent = 'piper: naturale e locale — sistema: sempre disponibile';
    msearch.style.display = 'none';
    mlist.innerHTML = '';
    const SUB = {piper: 'voce neurale naturale, locale (~63 MB)', sapi: 'Elsa SAPI / voce di sistema'};
    for (const m of d.engines) {
      const tag = m.downloading ? ' \u23f3 download\u2026' : (m.installed ? '' : '  \u2b07 non installato');
      const it = {title: (m.id === 'piper' ? 'Paola — Piper' : 'Voce di sistema') + tag,
                  subtitle: SUB[m.id] || '', kind: 'appx'};
      const rowEl = row(it);
      rowEl.classList.add('click');
      if (m.active) {
        const c = document.createElement('span'); c.className = 'check'; c.textContent = '\u2713';
        rowEl.appendChild(c);
      }
      rowEl.onclick = async () => {
        if (m.downloading) return;
        const rr = await fetch('/api/tts/engine', {method:'POST',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify({engine: m.id})});
        const dd = await rr.json();
        if (!dd.ok) { add('bot', 'Errore: ' + (dd.error || 'cambio fallito')); return; }
        ovl.classList.remove('open');
        const nameEl = document.getElementById('ttsname');
        if (dd.status === 'downloading') {
          nameEl.textContent = 'sistema (temp)';
          add('bot', '\u2b07\ufe0f Scarico la voce naturale Piper (~85 MB, in background). Finche\u0300 non e\u0300 pronta risponde la voce di sistema.');
          const poll = setInterval(async () => {
            try {
              const s = await (await fetch('/api/tts')).json();
              const me = s.engines.find(x => x.id === 'piper');
              if (me && me.installed) { clearInterval(poll);
                nameEl.textContent = 'Paola';
                add('bot', '\u2705 Voce naturale pronta: da ora risponde Paola.'); }
            } catch { clearInterval(poll); }
          }, 4000);
        } else {
          nameEl.textContent = m.id === 'piper' ? 'Paola' : 'sistema';
        }
      };
      mlist.appendChild(rowEl);
    }
    ovl.classList.add('open');
  } catch {}
}
document.getElementById('ttsbtn').onclick = openTtsMenu;
(async () => { try { const s = await (await fetch('/api/tts')).json();
  const a = s.engines.find(m => m.active);
  const el = document.getElementById('ttsname');
  if (!a) { el.textContent = '?'; return; }
  el.textContent = (a.id === 'piper') ? (a.installed ? 'Paola' : 'sistema (temp)') : 'sistema';
} catch {} })();
async function openApps() {
  try {
    const r = await fetch('/api/apps'); const d = await r.json();
    const items = (d.apps || []).map(a =>
      ({title: a.name, subtitle: KIND_LABEL[a.kind] || '', kind: a.kind}));
    showList('App e giochi installati', items);
  } catch {}
}
appsBtn.onclick = openApps;

// --- pannello memoria appresa (refusi + alias-app), modificabile a mano ---
function memRow(entry, kind) {
  const r = document.createElement('div'); r.className = 'mitem';
  const ic = document.createElement('div'); ic.className = 'ic';
  ic.textContent = kind === 'fix' ? '\u270f\ufe0f' : '\ud83d\udd17';
  const tx = document.createElement('div'); tx.className = 'tx';
  const b = document.createElement('b'); b.textContent = kind === 'fix'
    ? (entry.raw + ' \u2192 ' + entry.fixed)
    : (entry.said + ' \u2192 ' + entry.app);
  const s = document.createElement('small');
  s.textContent = (kind === 'fix' ? 'refuso' : 'alias app')
    + ' \u00b7 usato ' + (entry.count || 1) + 'x';
  tx.append(b, s);
  const del = document.createElement('button'); del.className = 'memdel';
  del.textContent = '\u00d7'; del.title = 'Elimina';
  del.onclick = async (ev) => {
    ev.stopPropagation();
    await fetch('/api/memory', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action: kind === 'fix' ? 'del_fix' : 'del_app', raw: kind === 'fix' ? entry.raw : entry.said})});
    openMem();  // ricarico il pannello
  };
  r.onclick = () => {
    const cur = kind === 'fix' ? entry.fixed : entry.app;
    const nu = prompt('Correggi la destinazione di "' + (kind === 'fix' ? entry.raw : entry.said) + '":', cur);
    if (nu && nu.trim() && nu.trim() !== cur) {
      fetch('/api/memory', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action: kind === 'fix' ? 'set_fix' : 'set_app',
                              raw: kind === 'fix' ? entry.raw : entry.said, fixed: nu.trim()})})
        .then(() => openMem());
    }
  };
  r.append(ic, tx, del); return r;
}

// --- pagina Routine (macro vocali) --------------------------------------
function routRow(r) {
  const el = document.createElement('div'); el.className = 'mitem';
  const ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = '\u26a1';
  const tx = document.createElement('div'); tx.className = 'tx';
  const b = document.createElement('b'); b.textContent = r.name;
  const s = document.createElement('small');
  s.textContent = r.steps.join(' \u2192 ') + ' \u00b7 usata ' + (r.count || 0) + 'x';
  tx.append(b, s);
  const run = document.createElement('button'); run.className = 'memdel';
  run.textContent = '\u25b6'; run.title = 'Esegui ora';
  run.onclick = async (ev) => {
    ev.stopPropagation();
    run.textContent = '\u2026';
    await fetch('/api/routines', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'run', id: r.id})});
    openRoutines();
  };
  const del = document.createElement('button'); del.className = 'memdel';
  del.textContent = '\u00d7'; del.title = 'Elimina';
  del.onclick = async (ev) => {
    ev.stopPropagation();
    await fetch('/api/routines', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'delete', id: r.id})});
    openRoutines();
  };
  el.append(ic, tx, run, del);
  el.onclick = () => editRoutine(r);
  return el;
}

function editRoutine(r) {
  const isNew = !r;
  const name = isNew ? '' : (r.name || '');
  const stepsStr = isNew ? '' : (r.steps || []).join('\n');
  const n = prompt(isNew ? 'Nome/trigger della routine (cosa dirai a voce):'
                         : 'Nome/trigger:', name);
  if (n === null) return openRoutines();
  const nm = n.trim();
  if (!nm) return openRoutines();
  const st = prompt('Comandi, uno per riga (max 8):\nes. apri spotify\nvolume 80\nche tempo fa', stepsStr);
  if (st === null) return openRoutines();
  const steps = st.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 8);
  if (!steps.length) return openRoutines();
  fetch('/api/routines', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action: isNew ? 'create' : 'update', id: isNew ? '' : r.id,
                          name: nm, steps})}).then(openRoutines);
}

async function openRoutines() {
  try {
    const r = await fetch('/api/routines'); const d = await r.json();
    const list = d.routines || [];
    document.getElementById('routcount').textContent = list.length;
    mtitle.textContent = '\u26a1 Routine';
    mcount.textContent = 'una frase attiva una sequenza di comandi \u2014 ' +
      'creale qui o a voce: \u201cUgo, quando dico modo gaming esegui apri steam; apri discord; volume 80\u201d';
    msearch.style.display = 'none';
    mlist.innerHTML = '';
    if (!list.length) {
      const e = document.createElement('div'); e.className = 'mitem';
      e.innerHTML = '<div class="tx"><small>Nessuna routine: creala col \u2795 o a voce.</small></div>';
      mlist.appendChild(e);
    }
    for (const r of list) mlist.appendChild(routRow(r));
    const add = document.createElement('div'); add.className = 'mitem click';
    add.innerHTML = '<div class="ic">\u2795</div><div class="tx"><b>Nuova routine</b>' +
      '<small>es. \u201cmodo gaming\u201d \u2192 apri steam, apri discord, volume 80</small></div>';
    add.onclick = () => editRoutine(null);
    mlist.appendChild(add);
    ovl.classList.add('open');
  } catch {}
}
document.getElementById('routbtn').onclick = openRoutines;

// --- dashboard latenze (📊) --------------------------------------------
const STAGE_LABEL = {
  vosk: 'Vosk (fastlane pre-lettura)', fastlane: 'Fastlane (match comandi)',
  whisper: 'Whisper (trascrizione)', qwen_normalize: 'Qwen (correzione STT)',
  qwen_intent: 'Qwen (interpretazione intent)', qwen_suggest: 'Qwen (suggerimento app)',
  tts_piper: 'TTS Piper (Paola)', tts_sapi: 'TTS di sistema',
  command: '⏱ Comando completo (voce → risposta)'
};
let statsTimer = null;

async function refreshStats() {
  try {
    const d = await (await fetch('/api/stats')).json();
    const cmd = (d.stages || []).find(s => s.stage === 'command');
    document.getElementById('statscmd').textContent =
      cmd ? cmd.avg.toFixed(1) + 's' : '…';
    if (!ovl.classList.contains('open')) {
      if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
      return;
    }
    mtitle.textContent = '📊 Dashboard latenze';
    mcount.textContent = 'ultimi 50 comandi per fase · modelli: STT ' + d.models.stt +
      ' · AI ' + d.models.llm + ' · TTS ' + d.models.tts;
    msearch.style.display = 'none';
    mlist.innerHTML = '';
    if (!(d.stages || []).length) {
      const e = document.createElement('div'); e.className = 'mitem';
      e.innerHTML = '<div class="tx"><small>Nessun dato ancora: dai un comando a Ugo ' +
        '(voce o testo) e i numeri compaiono qui in tempo reale.</small></div>';
      mlist.appendChild(e);
    }
    const others = d.stages.filter(s => s.stage !== 'command');
    const maxavg = Math.max(0.001, ...others.map(s => s.avg));
    for (const s of d.stages) {
      const el = document.createElement('div'); el.className = 'mitem';
      const pct = s.stage === 'command' ? 100 :
        Math.min(100, Math.round(s.avg / maxavg * 100));
      const tx = document.createElement('div'); tx.className = 'tx';
      const b = document.createElement('b'); b.textContent = STAGE_LABEL[s.stage] || s.stage;
      const sm = document.createElement('small');
      sm.textContent = 'media ' + s.avg.toFixed(2) + 's · p95 ' + s.p95.toFixed(2) +
        's · max ' + s.max.toFixed(2) + 's · ' + s.n + ' campioni';
      const bar = document.createElement('div');
      bar.style.cssText = 'height:6px;background:var(--border);border-radius:3px;margin-top:5px;overflow:hidden';
      const fill = document.createElement('div');
      fill.style.cssText = 'height:100%;width:' + pct + '%;background:var(--acc)';
      bar.appendChild(fill);
      tx.append(b, sm, bar);
      el.appendChild(tx);
      mlist.appendChild(el);
    }
    if (d.process && d.process.rss_mb) {
      const p = document.createElement('div'); p.className = 'mitem';
      p.innerHTML = '<div class="tx"><small>processo server: ' + d.process.rss_mb +
        ' MB RAM · cpu ' + d.process.cpu_pct + '% · ' + d.process.threads + ' thread</small></div>';
      mlist.appendChild(p);
    }
    const tog = document.createElement('div'); tog.className = 'mitem click';
    tog.innerHTML = '<div class="ic">' + (d.enabled ? '⏸' : '▶') + '</div><div class="tx"><b>' +
      (d.enabled ? 'Sospendi la raccolta dati' : 'Riprendi la raccolta dati') +
      '</b><small>il pannello continua a mostrare gli ultimi valori raccolti</small></div>';
    tog.onclick = async () => {
      await fetch('/api/stats', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({enabled: !d.enabled})});
      refreshStats();
    };
    mlist.appendChild(tog);
  } catch {}
}

function openStats() {
  ovl.classList.add('open');
  refreshStats();
  if (!statsTimer) statsTimer = setInterval(refreshStats, 3000);
}
document.getElementById('statsbtn').onclick = openStats;

async function openMem() {

    const r = await fetch('/api/memory'); const d = await r.json();
    document.getElementById('memcount').textContent = d.fixes.length + d.apps.length;
    mtitle.textContent = 'Memoria appresa';
    mcount.textContent = 'ci\u00f2 che Ugo ha imparato dai tuoi comandi \u2014 click per correggere, \u00d7 per eliminare';
    msearch.style.display = 'none';
    mlist.innerHTML = '';
    const h1 = document.createElement('div'); h1.className = 'mcat';
    h1.innerHTML = '<span class="chev">\u25be</span>Refusi corretti <span>\u00b7 ' + d.fixes.length + '</span>';
    mlist.appendChild(h1);
    if (!d.fixes.length) {
      const e = document.createElement('div'); e.className = 'mitem';

      mlist.appendChild(e);
    }
    for (const f of d.fixes) mlist.appendChild(memRow(f, 'fix'));

    h2.innerHTML = '<span class="chev">\u25be</span>Alias app <span>\u00b7 ' + d.apps.length + '</span>';

      '<small>es. \u201cspotifi\u201d deve diventare \u201cSpotify\u201d</small></div>';
    add.onclick = async () => {
      const raw = prompt('Il refuso (come lo detti/scrivi):');

      await fetch('/api/memory', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action: 'add_fix', raw: raw.trim(), fixed: fixed.trim()})});
      openMem();
    };
    mlist.appendChild(add);
    ovl.classList.add('open');
  } catch {}
}
document.getElementById('membtn').onclick = openMem;
(async () => { try { const d = await (await fetch('/api/memory')).json();
  document.getElementById('memcount').textContent = d.fixes.length + d.apps.length; } catch {} })();

async function maybeShowList() {
  try {
    const r = await fetch('/api/list'); const d = await r.json();
    if (d.count) showList(d.items.some(i => i.kind !== 'app' && ['steam','epic','gog','launcher'].includes(i.kind))
                          ? 'Giochi e launcher installati' : 'Applicazioni installate', d.items);
  } catch {}
}

function scroll() { chat.scrollTop = chat.scrollHeight; }
function setStatus(s) { statusEl.textContent = s || 'Ugo può sbagliare. I comandi vengono eseguiti realmente sul tuo PC.'; }

function add(role, text, meta, raw) {
  hero && hero.remove();
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'you' ? 'you' : 'bot');
  const av = document.createElement('div');
  av.className = 'av ' + (role === 'you' ? 'y' : 'b');
  av.textContent = role === 'you' ? '🧑' : '🎙️';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  if (raw) {
    const r = document.createElement('div'); r.className = 'rawstt';
    r.title = 'Trascrizione originale corretta da Qwen';
    r.textContent = '🎧 "' + raw + '"';
    b.appendChild(r);
  }
  if (meta) { const m = document.createElement('span'); m.className = 'meta'; m.textContent = meta; b.appendChild(m); }
  row.append(av, b); col.appendChild(row); scroll();
}

// ---- invio testo ----
async function sendText() {
  const t = textEl.value.trim(); if (!t) return;
  textEl.value = ''; textEl.style.height = 'auto';
  add('you', t); setStatus('Ugo sta elaborando…');
  try {
    const r = await fetch('/api/text', {method:'POST', headers:{'Content-Type':'application/json'},
                                        body:JSON.stringify({text:t})});
    const e = await r.json();
    add('bot', e.assistant || e.error || 'errore',
        e.intent && e.intent !== '-' ? `${e.intent} · ${e.detector} · ${e.ms} ms` : '');
    playReply();
    if (e.show_list) maybeShowList();
  } catch { add('bot', 'Server non raggiungibile.'); }
  setStatus('');
}
document.getElementById('send').onclick = sendText;
textEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
textEl.addEventListener('input', () => { textEl.style.height = 'auto'; textEl.style.height = Math.min(140, textEl.scrollHeight) + 'px'; });
document.querySelectorAll('.sugg button').forEach(b => b.onclick = () => { textEl.value = b.dataset.q; sendText(); });

// ---- microfono (come prima: webm -> /api/listen) ----
let media, chunks = [], recording = false;
micBtn.onclick = async () => {
  if (recording) { media.stop(); return; }
  try { media = new MediaRecorder(await navigator.mediaDevices.getUserMedia({audio:true})); }
  catch { setStatus('Permesso microfono negato'); return; }
  chunks = []; recording = true; micBtn.classList.add('rec'); setStatus('🔴 Sto ascoltando… clicca di nuovo per inviare');
  media.ondataavailable = e => chunks.push(e.data);
  media.onstop = async () => {
    recording = false; micBtn.classList.remove('rec'); setStatus('Trascrivo…');
    try {
      const fd = new FormData();
      fd.append('audio', new Blob(chunks, {type:'audio/webm'}), 'cmd.webm');
      const r = await fetch('/api/listen', {method:'POST', body:fd});
      const e = await r.json();
      if (e.error) { setStatus(e.error); return; }
      if (e.user) { add('you', e.user, '', e.raw); }
      add('bot', e.assistant, e.intent && e.intent !== '-' ? `${e.intent} · ${e.detector} · ${e.ms} ms` : '');
      if (e.show_list) maybeShowList();
    } catch { add('bot', 'Server non raggiungibile.'); }
    setStatus(''); playReply();
  };
  media.start();
};

async function playReply() { try { new Audio('/_tts_reply.wav?t=' + Date.now()).play(); } catch {} }
